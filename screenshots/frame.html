<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Side-by-side frame for the 360 pt popover: copy left, capture right at its own aspect ratio. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(circle at 75% 50%, {{BG1}} 0%, {{BG2}} 60%);
    color: {{TEXT}};
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    padding: 0 7vw;
    gap: 5vw;
  }
  h1 { font-size: 5.2vw; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
  h2 { font-size: 1.9vw; font-weight: 400; opacity: 0.6; line-height: 1.35; margin-top: 2vw; }
  .shot { display: flex; justify-content: center; }
  .shot img {
    max-height: 52vw;
    max-width: 100%;
    border-radius: 1.2vw;
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 2vw 6vw rgba(0, 0, 0, 0.8);
  }
</style>
</head>
<body class="{{FRAME_CLASS}}">
  <div class="copy">
    <h1>{{HEADLINE}}</h1>
    <h2>{{SUBHEADLINE}}</h2>
  </div>
  <div class="shot"><img src="shot.png" alt=""></div>
</body>
</html>

name: TransportPlannerNZ
options:
  bundleIdPrefix: org.transportplannernz
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  TransportPlannerNZ:
    type: application
    platform: macOS
    sources:
      - path: TransportPlannerNZ
    info:
      path: TransportPlannerNZ/Resources/Info.plist
      properties:
        CFBundleDisplayName: Transport Planner NZ
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.travel
        NSHumanReadableCopyright: Personal use
        NSLocationUsageDescription: Reminders only fire while you are at the office.
        NSLocationWhenInUseUsageDescription: Reminders only fire while you are at the office.
    entitlements:
      path: TransportPlannerNZ/Resources/TransportPlannerNZ.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.transportplannernz.TransportPlannerNZ
        ENABLE_HARDENED_RUNTIME: false
        SWIFT_OBJC_BRIDGING_HEADER: ""
  TransportPlannerNZTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TransportPlannerNZTests
      - path: TransportPlannerNZ/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.transportplannernz.TransportPlannerNZTests
        GENERATE_INFOPLIST_FILE: true
schemes:
  TransportPlannerNZ:
    build:
      targets:
        TransportPlannerNZ: all
        TransportPlannerNZTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [TransportPlannerNZTests]

name: NZTransportPlanner
options:
  bundleIdPrefix: org.nztransportplanner
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  NZTransportPlanner:
    type: application
    platform: macOS
    sources:
      - path: NZTransportPlanner
    info:
      path: NZTransportPlanner/Resources/Info.plist
      properties:
        CFBundleDisplayName: NZ Transport Planner
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.travel
        NSHumanReadableCopyright: Personal use
        NSLocationUsageDescription: Reminders only fire while you are at the office.
        NSLocationWhenInUseUsageDescription: Reminders only fire while you are at the office.
    entitlements:
      path: NZTransportPlanner/Resources/NZTransportPlanner.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nztransportplanner.NZTransportPlanner
        ENABLE_HARDENED_RUNTIME: false
        SWIFT_OBJC_BRIDGING_HEADER: ""
  NZTransportPlannerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NZTransportPlannerTests
      - path: NZTransportPlanner/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nztransportplanner.NZTransportPlannerTests
        GENERATE_INFOPLIST_FILE: true
schemes:
  NZTransportPlanner:
    build:
      targets:
        NZTransportPlanner: all
        NZTransportPlannerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [NZTransportPlannerTests]
